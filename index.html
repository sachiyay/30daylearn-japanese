<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiba's 30 Day Japanese Lesson</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top-nav">
  <button id="btn-home" title="Back to Shiba home">
    <span id="home-shiba-emoji">🥚</span>
    <span id="home-shiba-name"></span>
  </button>
</header>

<main id="app">

  <section id="view-dashboard" class="view">
    <h1>Shiba's 30 Day Japanese Lesson</h1>
    <div id="shiba-stage" class="shiba"></div>

    <div id="name-display-row">
      <span id="shiba-name-display"></span>
      <button id="btn-rename" title="Rename your Shiba">✏️</button>
    </div>
    <div id="name-edit-row" class="hidden">
      <input id="shiba-name-input" type="text" maxlength="20" placeholder="Name your Shiba">
      <button id="btn-save-name">Save Name</button>
    </div>

    <p id="day-progress"></p>
    <p id="streak-display"></p>
    <button id="btn-start-lesson">Start Today's Lesson</button>

    <div id="practice-section" class="hidden">
      <h3>Practice a past lesson</h3>
      <div id="practice-list"></div>
    </div>
  </section>

  <section id="view-lesson" class="view hidden">
    <h2 id="lesson-title"></h2>
    <div id="lesson-cards"></div>
    <button id="btn-to-quiz">I've reviewed these — start quiz</button>
  </section>

  <section id="view-quiz" class="view hidden">
    <h2>Quiz</h2>
    <p id="quiz-progress"></p>
    <div id="quiz-question"></div>
    <div id="quiz-choices"></div>
  </section>

  <section id="view-results" class="view hidden">
    <h2>Nice work!</h2>
    <p id="results-score"></p>
    <p id="results-growth"></p>
    <button id="btn-next-lesson" class="hidden">Continue to Next Lesson</button>
    <button id="btn-repeat-lesson" class="practice-btn">Repeat Today's Lesson</button>
    <button id="btn-to-dashboard" class="practice-btn">Back to Shiba</button>
  </section>

</main>

<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
