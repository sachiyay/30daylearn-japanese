<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiba's 30 Day Japanese Lesson</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="top-nav">
  <div id="home-group">
    <button id="btn-home" title="Back to Shiba home">
      <img id="home-shiba-emoji" alt="Shiba">
      <span id="home-shiba-name"></span>
    </button>
    <button id="btn-rename" title="Rename your Shiba">✏️</button>
  </div>
  <div id="streak-badge">🔥 <span id="streak-count">0</span></div>
</header>

<main id="app">

  <section id="view-dashboard" class="view">
    <h1 id="page-title">Shiba's 30 Day Japanese Lesson</h1>
    <div id="intro-stage">
      <p id="welcome-message" class="hidden fade-target"></p>
      <img id="shiba-stage" class="shiba fade-target" alt="Shiba">
    </div>

    <div id="name-edit-row" class="hidden fade-target">
      <input id="shiba-name-input" type="text" maxlength="20" placeholder="Name your Shiba">
      <button id="btn-save-name">Save Name</button>
    </div>

    <p id="day-progress" class="fade-target"></p>

    <div id="xp-bar-track" class="fade-target">
      <div id="xp-bar-fill"></div>
    </div>
    <p id="xp-bar-label" class="fade-target"></p>

    <button id="btn-start-lesson" class="fade-target">Start Today's Lesson</button>

    <div id="practice-section" class="hidden">
      <h3>Practice a past lesson</h3>
      <div id="practice-list"></div>
    </div>
  </section>

  <section id="view-lesson" class="view hidden">
    <h2 id="lesson-title"></h2>
    <div id="lesson-cards"></div>
    <button id="btn-to-quiz">I've reviewed these — start quiz</button>
  </section>

  <section id="view-quiz" class="view hidden">
    <h2>Quiz</h2>
    <div id="quiz-content">
      <p id="quiz-progress"></p>
      <div id="quiz-question"></div>
      <div id="quiz-choices"></div>
    </div>
  </section>

  <section id="view-results" class="view hidden">
    <h2>Nice work!</h2>
    <p id="results-score"></p>
    <p id="results-growth"></p>
    <div id="results-review"></div>
    <div id="results-actions-row">
      <button id="btn-repeat-lesson" class="practice-btn">Repeat Today's Lesson</button>
      <button id="btn-next-lesson" class="hidden">Continue to Next Lesson</button>
    </div>
    <button id="btn-to-dashboard" class="practice-btn">Back to Shiba</button>
  </section>

</main>

<div id="level-up-overlay" class="hidden">
  <div id="level-up-backdrop"></div>
  <div id="level-up-content">
    <img id="level-up-image" alt="">
    <p id="level-up-label"></p>
  </div>
</div>

<a href="#" id="btn-start-over" class="text-link hidden">Start from the beginning</a>
<p id="app-version">v3</p>

<script src="curriculum.js"></script>
<script src="app.js"></script>
</body>
</html>
