<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ec4e8"/>
      <stop offset="55%" stop-color="#bfe4f5"/>
      <stop offset="100%" stop-color="#fdf3e3"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9c9dd"/>
      <stop offset="100%" stop-color="#93b9d1"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb99a"/>
      <stop offset="100%" stop-color="#78a884"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9cf9e"/>
      <stop offset="100%" stop-color="#8fbf87"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="990" cy="150" r="70" fill="#fff3c4" opacity="0.9"/>
  <circle cx="990" cy="150" r="46" fill="#ffe9a8"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="180" cy="140" rx="70" ry="26"/>
    <ellipse cx="230" cy="150" rx="55" ry="22"/>
    <ellipse cx="130" cy="155" rx="45" ry="18"/>

    <ellipse cx="650" cy="90" rx="55" ry="20"/>
    <ellipse cx="690" cy="98" rx="40" ry="16"/>
  </g>

  <!-- Mt. Fuji, off-center -->
  <g>
    <polygon points="820,560 950,290 1080,560" fill="#9fb3c8"/>
    <polygon points="900,360 950,290 1000,360 985,352 965,330 950,318 935,330 915,352" fill="#f4f7fb"/>
  </g>

  <!-- soft far mountain range -->
  <path d="M0,600 C120,520 220,560 320,600 C420,560 520,540 620,590 C700,555 780,570 850,600 L1200,600 L1200,900 L0,900 Z" fill="url(#farHill)" opacity="0.6"/>

  <!-- torii gate on a small rise, left side -->
  <g transform="translate(160,470)">
    <ellipse cx="0" cy="118" rx="90" ry="18" fill="#7fae86" opacity="0.5"/>
    <rect x="-8" y="20" width="16" height="95" fill="#c1440e"/>
    <rect x="52" y="20" width="16" height="95" fill="#c1440e"/>
    <rect x="-24" y="0" width="108" height="18" rx="4" fill="#a8360a"/>
    <rect x="-14" y="24" width="88" height="12" fill="#a8360a"/>
  </g>

  <!-- cherry blossom tree, right side -->
  <g transform="translate(1030,470)">
    <path d="M0,150 C-4,110 6,80 0,50" stroke="#6b4a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M0,90 C-20,80 -34,60 -30,40" stroke="#6b4a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M0,80 C18,68 30,50 26,30" stroke="#6b4a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <g fill="#f7b6c9">
      <circle cx="-10" cy="30" r="34"/>
      <circle cx="24" cy="18" r="30"/>
      <circle cx="6" cy="-6" r="32"/>
      <circle cx="-30" cy="6" r="26"/>
    </g>
    <g fill="#fbd4e0" opacity="0.85">
      <circle cx="70" cy="120" r="4"/>
      <circle cx="95" cy="160" r="3"/>
      <circle cx="55" cy="190" r="4"/>
      <circle cx="-60" cy="150" r="3"/>
      <circle cx="-90" cy="190" r="4"/>
    </g>
  </g>

  <!-- mid rolling hill -->
  <path d="M0,660 C160,600 320,610 480,650 C640,690 760,610 920,630 C1040,645 1120,610 1200,630 L1200,900 L0,900 Z" fill="url(#midHill)"/>

  <!-- foreground hill (leaves an open, uncluttered strip bottom-center for the Shiba) -->
  <path d="M0,760 C200,720 380,790 600,770 C820,750 980,720 1200,760 L1200,900 L0,900 Z" fill="url(#nearHill)"/>
</svg>
